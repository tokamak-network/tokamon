[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
auto_detect_solc = false
verbosity = 1

# contract-address.json 출력 경로: listener-server
fs_permissions = [{ access = "read-write", path = "../listener-server" }]

[rpc_endpoints]
local = "http://127.0.0.1:8999"
