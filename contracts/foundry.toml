[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
test = "test"
script = "script"

# Solidity 버전
solc_version = "0.8.19"

# 최적화
optimizer = true
optimizer_runs = 200

# EVM 버전
evm_version = "paris"

# 자동 감지
auto_detect_solc = false

# 리매핑 (필요시)
remappings = []

# 파일 시스템 권한
fs_permissions = [{ access = "read-write", path = "../server" }]

# 빌드 출력 간소화
verbosity = 1

[rpc_endpoints]
local = "http://127.0.0.1:8999"
