# Tokamon listener-server nginx 리버스 프록시 설정
# TLS 종료 + HTTP→HTTPS 리다이렉트

# HTTP → HTTPS 리다이렉트 + ACME 챌린지
server {
    listen 80;
    server_name listener.tokamon.io;

    # Let's Encrypt 인증서 갱신용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 리버스 프록시
server {
    listen 443 ssl;
    server_name listener.tokamon.io;

    # TLS 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/listener.tokamon.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listener.tokamon.io/privkey.pem;

    # TLS 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 리버스 프록시 → listener-server (포트 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 지원 (헬스체크 등)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 헬스체크 캐시 비활성화
    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
