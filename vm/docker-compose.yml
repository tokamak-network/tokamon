# Tokamon listener-server VM 배포 구성
# 사용법: docker-compose up -d

services:
  # listener-server (Node.js)
  listener-server:
    image: gcr.io/tokamon-go/listener-server
    container_name: listener-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - listener-data:/data
    environment:
      - DATABASE_PATH=/data/telegram.db
      - LAST_BLOCK_PATH=/data/last-block-thanos-sepolia.json
      - METADATA_PATH=/data/spot-metadata-thanos-sepolia.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # nginx (TLS 종료 + 리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      listener-server:
        condition: service_healthy

  # certbot (Let's Encrypt 인증서 자동 갱신)
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12시간마다 인증서 갱신 시도
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  listener-data:
    driver: local
  certbot-conf:
    driver: local
  certbot-www:
    driver: local
